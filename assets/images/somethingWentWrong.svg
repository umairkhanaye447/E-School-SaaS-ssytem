<svg xmlns="http://www.w3.org/2000/svg" width="320" height="330" viewBox="0 0 320 330" fill="none">
  <!-- Generic failure. Amber warning rather than red so it reads as
       "retry this", not "destructive". -->

  <circle cx="160" cy="146" r="106" fill="#FFF4E6"/>
  <ellipse cx="160" cy="270" rx="112" ry="18" fill="#F1E7DA"/>

  <!-- back card -->
  <g transform="rotate(-7 160 150)">
    <rect x="86" y="86" width="148" height="118" rx="18" fill="#FBE3C7"/>
  </g>

  <!-- front card -->
  <rect x="94" y="98" width="152" height="122" rx="18" fill="#FFFFFF"/>
  <rect x="94.5" y="98.5" width="151" height="121" rx="17.5" stroke="#EFE2D2"/>
  <rect x="118" y="184" width="60" height="10" rx="5" fill="#F3E7D8"/>
  <rect x="188" y="184" width="34" height="10" rx="5" fill="#F7EEE3"/>

  <!-- warning triangle -->
  <path d="M160 96l62 108a14 14 0 0 1-12 21H110a14 14 0 0 1-12-21l62-108z" fill="#FFFFFF"/>
  <path d="M160 108l55 96a8 8 0 0 1-7 12H112a8 8 0 0 1-7-12l55-96z" fill="#F97316"/>
  <rect x="152" y="140" width="16" height="50" rx="8" fill="#FFFFFF"/>
  <circle cx="160" cy="204" r="9" fill="#FFFFFF"/>

  <!-- accents -->
  <circle cx="68" cy="100" r="8" fill="#FFC107"/>
  <circle cx="254" cy="82" r="6" fill="#F97316"/>
  <circle cx="252" cy="212" r="5" fill="#EF4444"/>
</svg>
