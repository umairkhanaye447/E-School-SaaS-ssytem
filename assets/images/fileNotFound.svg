<svg xmlns="http://www.w3.org/2000/svg" width="320" height="330" viewBox="0 0 320 330" fill="none">
  <!-- Empty state: nothing to show yet. Flat two-tone art on the brand blue
       ramp, matched to the dashboard card language. -->

  <!-- soft backdrop -->
  <circle cx="160" cy="146" r="106" fill="#EDF3FF"/>
  <ellipse cx="160" cy="270" rx="112" ry="18" fill="#E3EAF6"/>

  <!-- back sheet, tilted -->
  <g transform="rotate(-8 160 150)">
    <rect x="96" y="58" width="128" height="164" rx="16" fill="#DCE7FB"/>
  </g>

  <!-- front sheet -->
  <rect x="104" y="70" width="132" height="170" rx="16" fill="#FFFFFF"/>
  <rect x="104.5" y="70.5" width="131" height="169" rx="15.5" stroke="#DCE4F1"/>

  <!-- folded corner -->
  <path d="M236 108V86l-30 22h30z" fill="#EDF3FF"/>
  <path d="M206 86h30l-30 22V86z" fill="#DCE7FB"/>

  <!-- content lines -->
  <rect x="126" y="118" width="74" height="11" rx="5.5" fill="#E3EAF6"/>
  <rect x="126" y="141" width="94" height="11" rx="5.5" fill="#EDF1F8"/>
  <rect x="126" y="164" width="60" height="11" rx="5.5" fill="#EDF1F8"/>
  <rect x="126" y="187" width="82" height="11" rx="5.5" fill="#EDF1F8"/>

  <!-- magnifier -->
  <circle cx="206" cy="206" r="46" fill="#FFFFFF" fill-opacity="0.92"/>
  <circle cx="206" cy="206" r="40" fill="#EDF3FF"/>
  <circle cx="206" cy="206" r="40" stroke="#1B4DE4" stroke-width="11"/>
  <rect x="232" y="236" width="15" height="46" rx="7.5" transform="rotate(-42 232 236)" fill="#1B4DE4"/>

  <!-- accents -->
  <circle cx="72" cy="96" r="8" fill="#FFC107"/>
  <circle cx="252" cy="70" r="6" fill="#4F7BFF"/>
  <circle cx="66" cy="196" r="5" fill="#8B5CF6"/>
</svg>
